# Continuous integration: SEOCart's reusable extension workflow, at the commit seocart-core.env
# pins (bin/dev/bump-core.sh moves both). The jobs, what each runs and their names, which the
# repository's required checks follow, are in SEOCart's .github/workflows/extension-ci.yml.
# Beside them, browser-unit tests this plugin's browser scripts, the checkout's card form among
# them, under Node.js alone: no browser, no site and no secret.

name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

# A newer push to a pull request supersedes the run in progress. Runs on main are never
# cancelled: every commit on main keeps a complete result.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ci:
        uses: cirkuitnet/seocart/.github/workflows/extension-ci.yml@6d1edfff508682f1c43f3c50774b81a087091cb1
        with:
            extension-type: payments

    browser-unit:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out the extension
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: ext
                  persist-credentials: false

            # The Node.js version is SEOCart's, stated once in its .nvmrc at the pinned commit.
            - name: Read the SEOCart commit seocart-core.env pins
              id: core
              run: echo "ref=$(sed -n 's/^SEOCART_CORE_REF=\([0-9a-f]\{40\}\)$/\1/p' ext/seocart-core.env)" >>"$GITHUB_OUTPUT"

            - name: Check out SEOCart's .nvmrc
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: cirkuitnet/seocart
                  ref: ${{ steps.core.outputs.ref }}
                  path: seocart
                  sparse-checkout: .nvmrc
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: seocart/.nvmrc

            - name: Install the browser scripts' dependencies
              working-directory: ext/tests/browser
              run: npm ci

            - name: Test the browser scripts
              working-directory: ext/tests/browser
              run: node --test
