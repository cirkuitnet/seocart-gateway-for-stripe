# Proves the adapter against Stripe's test mode with the repository's two test secrets: the
# conformance suite with every request sent to Stripe; a shopper who never completes the bank's
# page; 3-D Secure completed in a browser on Stripe's test page, then resumed; the webhook
# endpoint set up at Stripe; and Stripe's real events read back and delivered to the store, before,
# after and twice around its own answers, and soaked. Started by hand or weekly, never by a
# pull request or a push, so it is never a check a merge waits for: a provider's outage must
# not block one.
#
# SEOCart's extension workflow (extension-ci.yml) takes no secrets, so each job here repeats its
# set-up: the two checkouts, the SEOCart commit chosen as it chooses it (core-ref on these events,
# else the pin read from ext/seocart-core.env when the job runs), the MySQL service and the PHP
# set-up, written once below as YAML anchors. The steps themselves are bin/ci/stripe-test-mode.sh.
#
# Each secret reaches only the steps that need it, through their env. The tests read the
# credentials from one file, readable by its owner alone, in the runner's temporary directory,
# outside the checkout; it is never uploaded, and every job removes it at its end. Nothing is
# committed, pushed or uploaded: a run against Stripe writes its recordings on the runner only.
# Every job removes what it left at Stripe that it can: a PaymentIntent cannot be deleted, so
# those the run left waiting are cancelled; the webhooks job, which alone sets up the webhook
# endpoint of the run's installation, deletes it.

name: Stripe test mode

on:
    schedule:
        # Weekly, off the hour. A scheduled run takes the inputs' defaults.
        - cron: '17 5 * * 1'
    workflow_dispatch:
        inputs:
            core-ref:
                description: 'The SEOCart commit to test against: empty for the one ext/seocart-core.env pins, a full commit SHA, or main.'
                type: string
                default: ''
            parts:
                description: 'The parts to run.'
                type: choice
                options:
                    - all
                    - conformance
                    - three-d-secure
                    - webhooks
                default: all
            soak-size:
                description: 'How many payments the webhook soak places, from 7 to 60.'
                type: string
                default: '12'

permissions:
    contents: read

# The test account is shared: one run uses it at a time, and none is cancelled halfway, which
# would leave its payments waiting at Stripe.
concurrency:
    group: stripe-test-mode
    cancel-in-progress: false

env:
    # The WordPress the integration jobs install, as SEOCart's extension workflow does.
    WORDPRESS_VERSION: '7.1'
    # Throwaway values for the MySQL service container, as SEOCart's extension workflow has
    # them: the container lives for one job and is reachable from nowhere else.
    SEOCART_CI_DB_HOST: '127.0.0.1:3306'
    SEOCART_CI_DB_USER: root
    SEOCART_CI_DB_PASSWORD: ci-throwaway
    SEOCART_CI_DB_NAME: seocart_tests

jobs:
    live-conformance:
        if: github.repository == 'cirkuitnet/seocart-gateway-for-stripe' && contains(fromJSON('["all", "conformance"]'), inputs.parts || 'all')
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        outputs:
            ext-head: ${{ steps.heads.outputs.ext-head }}
            core-head: ${{ steps.heads.outputs.core-head }}
            nonce: ${{ steps.run.outputs.nonce }}
            tests: ${{ steps.run.outputs.tests }}
            assertions: ${{ steps.run.outputs.assertions }}
            skipped: ${{ steps.run.outputs.skipped }}
            skip-set: ${{ steps.run.outputs.skip-set }}
        services:
            mysql: &mysql
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: ${{ env.SEOCART_CI_DB_PASSWORD }}
                    MYSQL_DATABASE: ${{ env.SEOCART_CI_DB_NAME }}
                ports:
                    - 3306:3306
                # --host forces TCP: while the image initialises, MySQL listens on its socket
                # only, so the container turns healthy when the real server accepts connections.
                options: >-
                    --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=24
        steps:
            - &checkout-extension
              name: Check out the extension
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: ext
                  persist-credentials: false

            # Before any set-up: a missing secret fails the job at once, naming the secret.
            - &check-secrets
              name: Check the test secrets
              run: sh ext/bin/ci/stripe-test-mode.sh check-secrets
              env:
                  STRIPE_TEST_RESTRICTED_KEY: ${{ secrets.STRIPE_TEST_RESTRICTED_KEY }}
                  STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}

            # As SEOCart's extension workflow chooses it: core-ref on a schedule or a dispatch,
            # else the one line SEOCART_CORE_REF=<40 hex> of ext/seocart-core.env, read now, so
            # bin/dev/bump-core.sh moves this workflow's SEOCart with the pin.
            - &choose-core
              name: Choose the SEOCart commit
              id: core
              run: |
                  if [ -n "$CORE_REF" ]; then
                      case $GITHUB_EVENT_NAME in
                          schedule | workflow_dispatch) ;;
                          *)
                              echo "::error::core-ref is refused on a $GITHUB_EVENT_NAME run: only a schedule or workflow_dispatch run may pass core-ref."
                              exit 1
                              ;;
                      esac
                  fi
                  ref=${CORE_REF:-$(sed -n 's/^SEOCART_CORE_REF=\([0-9a-f]\{40\}\)$/\1/p' ext/seocart-core.env)}
                  case $ref in
                      main) ;;
                      *[!0-9a-f]* | '') ref='' ;;
                      *) [ "${#ref}" -eq 40 ] || ref='' ;;
                  esac
                  if [ -z "$ref" ]; then
                      echo "::error::No SEOCart commit to test against: ext/seocart-core.env must hold the line SEOCART_CORE_REF=<40 hexadecimal digits>, and core-ref may only be a commit like it or main."
                      exit 1
                  fi
                  echo "ref=$ref" >>"$GITHUB_OUTPUT"
              env:
                  CORE_REF: ${{ inputs.core-ref }}

            - &checkout-core
              name: Check out SEOCart beside the extension
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: cirkuitnet/seocart
                  ref: ${{ steps.core.outputs.ref }}
                  path: seocart
                  persist-credentials: false

            - &heads
              name: Note the commits under test
              id: heads
              run: sh ext/bin/ci/stripe-test-mode.sh heads

            - &setup-php
              name: Set up PHP and Composer
              uses: ./seocart/.github/actions/setup-php-composer
              with:
                  working-directory: seocart
                  extensions: mysqli
                  tools: wp-cli:2.12.0
                  install: full

            - &prepare-wordpress
              name: Download WordPress and write SEOCart's test configuration
              run: sh seocart/bin/ci/prepare-integration.sh "$WORDPRESS_VERSION"

            # Written last, just before the tests that read it.
            - &settings
              name: Write the test settings file
              run: sh ext/bin/ci/stripe-test-mode.sh settings
              env:
                  STRIPE_TEST_RESTRICTED_KEY: ${{ secrets.STRIPE_TEST_RESTRICTED_KEY }}
                  STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}

            # The suite as the replay runs it, every request sent to Stripe: the replay's 17 tests
            # with its two skips, rules 9 and 17, and no other. The PaymentIntents it creates are
            # read from the tapes it records onto the run list, which the cleanup works from.
            - name: Run the conformance suite against Stripe's test mode
              id: run
              run: sh ext/bin/ci/stripe-test-mode.sh conformance

            - &cleanup
              name: Clean up at Stripe, and remove the settings file
              if: always()
              run: sh ext/bin/ci/stripe-test-mode.sh cleanup

    three-d-secure:
        if: github.repository == 'cirkuitnet/seocart-gateway-for-stripe' && contains(fromJSON('["all", "three-d-secure"]'), inputs.parts || 'all')
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        outputs:
            ext-head: ${{ steps.heads.outputs.ext-head }}
            core-head: ${{ steps.heads.outputs.core-head }}
            tests: ${{ steps.run.outputs.tests }}
            assertions: ${{ steps.run.outputs.assertions }}
            skipped: ${{ steps.run.outputs.skipped }}
            api-versions: ${{ steps.run.outputs.api-versions }}
        services:
            mysql: *mysql
        steps:
            - *checkout-extension
            - *check-secrets
            - *choose-core
            - *checkout-core
            - *heads
            - *setup-php
            - *prepare-wordpress

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: seocart/.nvmrc

            - name: Install the browser script's dependencies
              working-directory: ext/tests/browser
              run: npm ci

            - name: Install Chromium for Playwright
              working-directory: ext/tests/browser
              run: npx playwright install --with-deps chromium

            - name: Test the browser script's output
              working-directory: ext/tests/browser
              run: node --test

            - *settings

            # A shopper who never completes the bank's page; 3-D Secure completed in the browser,
            # then resumed, left to the window's end, or announced by Stripe's event first.
            - name: Run the 3-D Secure tests against Stripe's test mode
              id: run
              run: sh ext/bin/ci/stripe-test-mode.sh live three-d-secure

            - *cleanup

    webhooks:
        if: github.repository == 'cirkuitnet/seocart-gateway-for-stripe' && contains(fromJSON('["all", "webhooks"]'), inputs.parts || 'all')
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        outputs:
            ext-head: ${{ steps.heads.outputs.ext-head }}
            core-head: ${{ steps.heads.outputs.core-head }}
            tests: ${{ steps.run.outputs.tests }}
            assertions: ${{ steps.run.outputs.assertions }}
            skipped: ${{ steps.run.outputs.skipped }}
            api-versions: ${{ steps.run.outputs.api-versions }}
            seed: ${{ steps.run.outputs.seed }}
        services:
            mysql: *mysql
        steps:
            - *checkout-extension
            - *check-secrets

            - name: Check the soak's size
              run: sh ext/bin/ci/stripe-test-mode.sh soak-size
              env:
                  SOAK_SIZE: ${{ inputs.soak-size || '12' }}

            - *choose-core
            - *checkout-core
            - *heads
            - *setup-php
            - *prepare-wordpress
            - *settings

            # The webhook endpoint set up, reused and removed; Stripe's real events delivered
            # after the store's answers and twice; and the soak of them.
            - name: Run the webhook tests against Stripe's test mode
              id: run
              run: sh ext/bin/ci/stripe-test-mode.sh live webhooks
              env:
                  SOAK_SIZE: ${{ inputs.soak-size || '12' }}

            # This job alone sets up the webhook endpoint, so it alone deletes it: the jobs run at
            # the same time, and another job's cleanup would delete it under the webhook tests.
            - name: Clean up at Stripe, the webhook endpoint included, and remove the settings file
              if: always()
              run: sh ext/bin/ci/stripe-test-mode.sh cleanup endpoints

    verdict:
        needs: [live-conformance, three-d-secure, webhooks]
        if: always() && github.repository == 'cirkuitnet/seocart-gateway-for-stripe'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - *checkout-extension

            # PHP from the runner's image: the verdict reads only the jobs' results and outputs.
            - name: Judge the run
              run: sh ext/bin/ci/stripe-test-mode.sh verdict
              env:
                  STRIPE_TEST_MODE_NEEDS: ${{ toJSON(needs) }}
                  STRIPE_TEST_MODE_PARTS: ${{ inputs.parts || 'all' }}
